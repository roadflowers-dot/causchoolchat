<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학교 채팅</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 데모 모드 안내 (Firebase 설정 전) -->
  <div id="demo-banner" class="demo-banner" hidden>
    데모 모드: Firebase 설정 전이라 이 브라우저 안에서만 동작합니다. <code>public/js/firebase-config.js</code>를 채우면 실제 서비스로 바뀝니다.
  </div>

  <!-- ① 로그인 화면 -->
  <section id="login-view" class="login-view" hidden>
    <div class="login-card">
      <div class="logo">💬</div>
      <h1>학교 채팅</h1>
      <p>학교 구글 계정으로 로그인하세요.</p>
      <button id="login-btn" class="google-btn">
        <span class="g">G</span> Google 계정으로 로그인
      </button>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- ② 채팅 화면 -->
  <section id="chat-view" class="chat-view" hidden>
    <!-- 왼쪽: 채팅방 목록 -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <strong>채팅방</strong>
        <button id="new-room-btn" class="icon-btn" title="새 채팅방">＋</button>
      </header>
      <ul id="room-list" class="room-list"></ul>
      <footer class="me">
        <img id="me-photo" class="avatar" alt="" />
        <div class="me-info">
          <div id="me-name" class="me-name"></div>
          <div id="me-email" class="me-email"></div>
        </div>
        <button id="logout-btn" class="text-btn">로그아웃</button>
      </footer>
    </aside>

    <!-- 가운데: 메시지 영역 -->
    <main class="room">
      <header class="room-header">
        <button id="menu-btn" class="icon-btn menu-btn" title="채팅방 목록">☰</button>
        <h2 id="room-title">채팅방을 선택하세요</h2>
        <button id="files-btn" class="text-btn" title="이 방에 공유된 파일">📎 파일함</button>
      </header>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <label class="icon-btn attach" title="파일 첨부">
          📎<input id="file-input" type="file" hidden />
        </label>
        <input id="message-input" type="text" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="2000" />
        <button type="submit" class="send-btn">전송</button>
      </form>
      <div id="upload-progress" class="upload-progress" hidden><div class="bar"></div></div>
    </main>

    <!-- 오른쪽: 공유된 파일 목록 (토글) -->
    <aside id="files-panel" class="files-panel" hidden>
      <header class="sidebar-header">
        <strong>공유된 파일</strong>
        <button id="files-close" class="icon-btn" title="닫기">✕</button>
      </header>
      <ul id="file-list" class="file-list"></ul>
    </aside>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
