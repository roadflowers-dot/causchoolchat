<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <title>중대부초 실시간 채팅방</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <script>
    // 화면이 깜빡이지 않도록, 저장된 테마를 가장 먼저 적용
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 데모 모드 안내 (Firebase 설정 전) -->
  <div id="demo-banner" class="demo-banner" hidden>
    데모 모드: 이 브라우저 안에서만 동작하는 연습 화면입니다.
  </div>

  <!-- ① 로그인 화면 -->
  <section id="login-view" class="login-view" hidden>
    <div class="login-card">
      <div class="logo">💬</div>
      <h1>중대부초<br />실시간 채팅방</h1>
      <p>구글 계정으로 로그인하세요.</p>
      <button id="login-btn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google 계정으로 로그인
      </button>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- ② 채팅 화면 -->
  <section id="chat-view" class="chat-view" hidden>
    <div id="backdrop" class="backdrop" hidden></div>

    <!-- 왼쪽: 채팅방 목록 -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <strong class="brand">💬 중대부초 채팅</strong>
        <div class="header-actions">
          <button id="notify-btn" class="icon-btn" title="새 메시지 알림 켜기">🔕</button>
          <button id="theme-btn" class="icon-btn" title="다크 모드">🌙</button>
          <button id="new-room-btn" class="icon-btn" title="새 채팅방">＋</button>
        </div>
      </header>
      <ul id="room-list" class="room-list"></ul>
      <footer class="me">
        <img id="me-photo" class="avatar" alt="" referrerpolicy="no-referrer" />
        <div class="me-info">
          <div id="me-name" class="me-name"></div>
          <div id="me-email" class="me-email"></div>
        </div>
        <button id="logout-btn" class="text-btn">로그아웃</button>
      </footer>
    </aside>

    <!-- 가운데: 메시지 영역 -->
    <main class="room">
      <header class="room-header">
        <button id="menu-btn" class="icon-btn menu-btn" title="채팅방 목록">☰<span id="menu-dot" class="dot" hidden></span></button>
        <span id="room-icon" class="room-icon"></span>
        <h2 id="room-title">채팅방을 선택하세요</h2>
        <button id="files-btn" class="pill-btn" title="이 방에 공유된 파일">📎 파일함</button>
      </header>

      <div id="messages" class="messages"></div>
      <button id="jump-btn" class="jump-btn" hidden>↓ 새 메시지</button>

      <div id="reply-bar" class="reply-bar" hidden>
        <div class="reply-info">
          <div class="reply-to">↩ <b id="reply-name"></b>에게 답장</div>
          <div id="reply-text" class="reply-text"></div>
        </div>
        <button id="reply-cancel" class="icon-btn" title="답장 취소">✕</button>
      </div>
      <form id="composer" class="composer">
        <label class="icon-btn attach" title="파일 첨부 (5MB까지)">
          📎<input id="file-input" type="file" hidden />
        </label>
        <textarea id="message-input" rows="1" placeholder="메시지를 입력하세요" maxlength="2000"></textarea>
        <button type="submit" class="send-btn" title="전송 (Enter)">➤</button>
      </form>
      <div id="upload-progress" class="upload-progress" hidden><div class="bar"></div></div>
    </main>

    <!-- 오른쪽: 공유된 파일 목록 (토글) -->
    <aside id="files-panel" class="files-panel" hidden>
      <header class="sidebar-header">
        <strong>공유된 파일</strong>
        <button id="files-close" class="icon-btn" title="닫기">✕</button>
      </header>
      <ul id="file-list" class="file-list"></ul>
    </aside>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
